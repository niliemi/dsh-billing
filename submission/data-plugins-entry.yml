url: https://github.com/niliemi/dsh-billing
name: niliemi/dsh-billing
category: usage
description:
  en: Prices tokens with the official model price table, keeps the per-session and global running cost beside the composer context meter, mirrors your DeepSeek account balance in the sidebar, and blocks a turn once spend passes the balance or a per-session ceiling.
  zh: 按官方模型价目表把 token 折算成费用，在聊天框底部上下文环旁常驻显示本会话与全局的已用金额，在左侧边栏显示账户余额，并在费用超过余额或单会话上限时阻断该轮（可一次性或按会话放行）。
